name: marketplace

x-go-service: &go-service
  profiles: [app]
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "/server", "healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 5s

x-common-env: &common-env
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Probe over TCP: on a fresh volume the entrypoint first runs init.sql on
      # a temporary socket-only server, which a socket probe reports as ready
      # just before it restarts, so db-init's TCP connection was refused.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U marketplace -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  # init.sql only runs on an empty volume, and pgdata is shared across
  # worktrees and clones: this job creates any missing database on every up.
  db-init:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: marketplace
      PGPASSWORD: marketplace
      PGDATABASE: postgres
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for db in identity_db catalog_db order_db payment_db ledger_db; do
          echo "SELECT 'CREATE DATABASE $$db' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$$db')\gexec" | psql -v ON_ERROR_STOP=1 -q
        done
    restart: "no"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for t in order.events payment.events payout.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done
    restart: "no"

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing local/product-images
        mc anonymous set download local/product-images
    restart: "no"

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "127.0.0.1:16686:16686"

  identity:
    <<: *go-service
    build:
      context: ..
      dockerfile: services/identity/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: identity
      HTTP_ADDR: ":8081"
      GRPC_ADDR: ":9081"
      DATABASE_URL: postgres://marketplace:marketplace@postgres:5432/identity_db?sslmode=disable
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      COOKIE_SECURE: "false"
    volumes:
      - ./secrets/jwt_private.pem:/run/secrets/jwt_private.pem:ro
    depends_on:
      db-init:
        condition: service_completed_successfully

  catalog:
    <<: *go-service
    build:
      context: ..
      dockerfile: services/catalog/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: catalog
      HTTP_ADDR: ":8082"
      GRPC_ADDR: ":9082"
      DATABASE_URL: postgres://marketplace:marketplace@postgres:5432/catalog_db?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      IDENTITY_GRPC_ADDR: identity:9081
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: product-images
      PUBLIC_ASSET_BASE_URL: http://localhost:9000/product-images
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  order:
    <<: *go-service
    build:
      context: ..
      dockerfile: services/order/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: order
      HTTP_ADDR: ":8083"
      GRPC_ADDR: ":9083"
      DATABASE_URL: postgres://marketplace:marketplace@postgres:5432/order_db?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: kafka:9092
      CATALOG_GRPC_ADDR: catalog:9082
      SHIPPING_FEE_FLAT: "30000"
      SWEEPER_INTERVAL: ${SWEEPER_INTERVAL:-60s}
      PAYMENT_GRPC_ADDR: payment:9084
      ONLINE_PAYMENT_METHODS: VNPAY,STRIPE
      COMMISSION_RATE_BPS: "500"
      PAYMENT_TIMEOUT: ${PAYMENT_TIMEOUT:-30m}
      AUTO_COMPLETE_AFTER: ${AUTO_COMPLETE_AFTER:-72h}
      PENDING_TIMEOUT: 2m
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  payment:
    <<: *go-service
    build:
      context: ..
      dockerfile: services/payment/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: payment
      HTTP_ADDR: ":8084"
      GRPC_ADDR: ":9084"
      DATABASE_URL: postgres://marketplace:marketplace@postgres:5432/payment_db?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      ORDER_GRPC_ADDR: order:9083
      PUBLIC_BASE_URL: http://localhost:3000
      PROVIDER_VNPAY: ${PROVIDER_VNPAY:-fake}
      PROVIDER_STRIPE: ${PROVIDER_STRIPE:-fake}
      FAKE_WEBHOOK_URL: http://gateway:8080/api/payments/fake/webhook
      FAKE_WEBHOOK_SECRET: dev-fake-secret
      FAKE_WEBHOOK_DELAY: ${FAKE_WEBHOOK_DELAY:-500ms}
      RECONCILE_INTERVAL: ${RECONCILE_INTERVAL:-60s}
      RECONCILE_MIN_AGE: ${RECONCILE_MIN_AGE:-2m}
      REFUND_MAX_ATTEMPTS: "8"
    # Provider credentials (VNPAY_*, STRIPE_*): see secrets/payment.env.example.
    env_file:
      - path: ./secrets/payment.env
        required: false
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  ledger:
    <<: *go-service
    build:
      context: ..
      dockerfile: services/ledger/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: ledger
      HTTP_ADDR: ":8085"
      GRPC_ADDR: ":9085"
      DATABASE_URL: postgres://marketplace:marketplace@postgres:5432/ledger_db?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      PAYOUT_MIN_AMOUNT: "50000"
      PAYOUT_SETTLE_INTERVAL: ${PAYOUT_SETTLE_INTERVAL:-30s}
      PAYOUT_SETTLE_DELAY: ${PAYOUT_SETTLE_DELAY:-1m}
      PENDING_POSTING_INTERVAL: 10s
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  gateway:
    <<: *go-service
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: gateway
      HTTP_ADDR: ":8080"
      IDENTITY_URL: http://identity:8081
      CATALOG_URL: http://catalog:8082
      ORDER_URL: http://order:8083
      PAYMENT_URL: http://payment:8084
      LEDGER_URL: http://ledger:8085
      IDENTITY_JWKS_URL: http://identity:8081/.well-known/jwks.json
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      UPSTREAM_TIMEOUT: 10s
      # Trust only the web container (fixed address below), so the real client
      # IP from nginx's X-Forwarded-For keys the rate limits. Trusting the whole
      # subnet would let host clients, which arrive from its gateway address,
      # forge X-Forwarded-For.
      TRUSTED_PROXIES: "172.30.203.10"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      identity:
        condition: service_healthy
      catalog:
        condition: service_healthy
      order:
        condition: service_healthy
      payment:
        condition: service_healthy
      ledger:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.203.0/24
          # Dynamic addresses stay in the upper half, so web's fixed address never collides.
          ip_range: 172.30.203.128/25

volumes:
  pgdata:
  miniodata:
