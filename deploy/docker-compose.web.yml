# Added by the Makefile once WS5 has created web/.
# Contract: web/Dockerfile serves the SPA on :80 and proxies /api to http://gateway:8080.
services:
  web:
    profiles: [app]
    build:
      context: ../web
    ports:
      - "127.0.0.1:3000:80"
    networks:
      default:
        # The gateway trusts this address as its only proxy (TRUSTED_PROXIES).
        ipv4_address: 172.30.203.10
    depends_on:
      gateway:
        condition: service_healthy
