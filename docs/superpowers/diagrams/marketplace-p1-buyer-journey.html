<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buyer journey, from sign-up to receipt</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1420px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1240px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">User journey · Diagram Design</p>
    <h1>Buyer journey, from sign-up to receipt</h1>

    <svg viewBox="0 0 1424 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="marketplace-p1-buyer-journey-title marketplace-p1-buyer-journey-desc">
      <title id="marketplace-p1-buyer-journey-title">Buyer journey, from sign-up to receipt</title>
      <desc id="marketplace-p1-buyer-journey-desc">User journey map of a Vietnamese-speaking buyer across six stages — register, browse, product detail, cart, checkout, and tracking — with a sentiment curve that dips at checkout over stock that can change under the cart, and a second pain marker where a cancelled order returns its stock asynchronously.</desc>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- =================================================================
           STAGE GRID — 6 columns of 208px on a 24px gutter, left margin 64.
           Dot x = column centre. col_left = 64 + i*232, centre = +104.
           ================================================================= -->

      <!-- Stage headers -->
      <text x="168"  y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 1</text>
      <text x="168"  y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Register or log in</text>

      <text x="400"  y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 2</text>
      <text x="400"  y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browse and search</text>

      <text x="632"  y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 3</text>
      <text x="632"  y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Product detail</text>

      <text x="864"  y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 4</text>
      <text x="864"  y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cart</text>

      <text x="1096" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 5</text>
      <text x="1096" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Checkout</text>

      <text x="1328" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 6</text>
      <text x="1328" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Track and complete</text>

      <!-- Sentiment band: HIGH / NEUTRAL / LOW reference hairlines -->
      <line x1="64" y1="110" x2="1384" y2="110" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <line x1="64" y1="190" x2="1384" y2="190" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <line x1="64" y1="270" x2="1384" y2="270" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="56" y="114" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.10em">HIGH</text>
      <text x="56" y="194" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.10em">NEUTRAL</text>
      <text x="56" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.10em">LOW</text>

      <!-- Sentiment curve — a data curve, not a connector (§6 rule 1 exempt).
           Ordinal levels: HIGH 110 · MED-HIGH 150 · NEUTRAL 190 · LOW 270.
           The trough is stage 5 (checkout): LOW, with a coral incoming segment. -->
      <polyline points="168,110 400,150 632,110" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-linejoin="round"/>
      <polyline points="632,110 864,150" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-linejoin="round"/>
      <polyline points="864,150 1096,270" fill="none" stroke="#eb6c36" stroke-width="1.5" stroke-linejoin="round"/>
      <polyline points="1096,270 1328,190" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-linejoin="round"/>

      <circle cx="168"  cy="110" r="5" fill="#4f5d75"/>
      <circle cx="400"  cy="150" r="5" fill="#4f5d75"/>
      <circle cx="632"  cy="110" r="5" fill="#4f5d75"/>
      <circle cx="864"  cy="150" r="5" fill="#4f5d75"/>
      <circle cx="1096" cy="270" r="5" fill="#eb6c36"/>
      <circle cx="1328" cy="190" r="5" fill="#4f5d75"/>

      <!-- Row separators (full plot width) -->
      <line x1="64" y1="300" x2="1384" y2="300" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <line x1="64" y1="380" x2="1384" y2="380" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <line x1="64" y1="440" x2="1384" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

      <!-- Row labels -->
      <text x="72" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">ACTIONS</text>
      <text x="72" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">TOUCHPOINTS</text>
      <text x="72" y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">RULES</text>

      <!-- Actions -->
      <text x="168"  y="324" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">Create an account</text>
      <text x="400"  y="324" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">Scan categories, search</text>
      <text x="632"  y="324" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">Pick a variant, read stock</text>
      <text x="864"  y="324" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">Add from several shops</text>
      <text x="1096" y="324" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">Address, COD, place order</text>
      <text x="1328" y="324" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">Watch status, confirm received</text>

      <!-- Pain marker 1 — the trough (checkout) -->
      <rect x="1000" y="336" width="192" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="rgba(235,108,54,0.50)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="1096" y="348" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">STOCK MOVED SINCE CART</text>

      <rect x="1000" y="356" width="192" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="rgba(235,108,54,0.50)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="1096" y="368" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">409 OUT_OF_STOCK, LINES SHOWN</text>

      <!-- Touchpoints -->
      <text x="168"  y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auth form</text>
      <text x="400"  y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">grid · /search</text>
      <text x="632"  y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gallery</text>
      <text x="864"  y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cart page</text>
      <text x="1096" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">checkout</text>
      <text x="1328" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">order list</text>

      <!-- Rules — the contract detail that makes the journey specific -->
      <text x="168"  y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">token in memory</text>
      <text x="400"  y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">unaccent match</text>
      <text x="632"  y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sku + stock</text>
      <text x="864"  y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">own shop blocked</text>
      <text x="1096" y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">one order per shop</text>
      <text x="1328" y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">idempotency key</text>

      <text x="1328" y="484" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cancel returns stock</text>

      <!-- =================================================================
           EDITORIAL NOTE — the second pain marker, in prose, because the
           journey has spent its two-marker budget on checkout.
           ================================================================= -->
      <text x="64" y="524" fill="#2d3142" font-size="14 font-style="italic" font-family="'Instrument Serif', serif">Cancelling shows the order cancelled before the stock is actually back — it returns through Kafka.</text>
      <text x="64" y="544" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">THE E2E TEST POLLS UP TO 5 S FOR THE RESTOCK · UI COPY IS VIETNAMESE WHILE THE CODE AND DOCS ARE ENGLISH</text>

      <!-- Legend — horizontal strip at the bottom -->
      <line x1="40" y1="560" x2="1384" y2="560" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="200" y1="572" x2="216" y2="572" stroke="#4f5d75" stroke-width="1.5"/>
      <circle cx="208" cy="572" r="3" fill="#4f5d75"/>
      <text x="224" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sentiment curve</text>

      <line x1="420" y1="572" x2="436" y2="572" stroke="#eb6c36" stroke-width="1.5"/>
      <circle cx="428" cy="572" r="3" fill="#eb6c36"/>
      <text x="444" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Trough stage — checkout</text>

      <rect x="700" y="568" width="16" height="8" rx="2" fill="rgba(235,108,54,0.08)" stroke="rgba(235,108,54,0.50)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="724" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Pain marker</text>

      <line x1="880" y1="572" x2="896" y2="572" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="904" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Reference level (high / neutral / low)</text>
    </svg>
  </div>
</body>
</html>
