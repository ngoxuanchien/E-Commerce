<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order cancellation, then asynchronous stock release</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>Cancelling an order returns stock asynchronously</h1>

    <svg viewBox="0 0 1000 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="marketplace-p1-cancel-release-sequence-title marketplace-p1-cancel-release-sequence-desc">
      <title id="marketplace-p1-cancel-release-sequence-title">Order cancellation, then asynchronous stock release</title>
      <desc id="marketplace-p1-cancel-release-sequence-desc">One transaction writes the cancelled status, the history row and two outbox rows and answers the caller 200; the outbox relay then publishes OrderCancelled to Kafka and the catalog consumer returns the reserved quantity to each SKU.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ── ALT frame (single fragment) ─────────────────────────── -->
      <!-- none in this diagram: the happy path is the whole story -->

      <!-- ── Lifelines ────────────────────────────────────────────── -->
      <line x1="100" y1="92" x2="100" y2="436" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="300" y1="92" x2="300" y2="436" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="500" y1="92" x2="500" y2="564" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="700" y1="92" x2="700" y2="608" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="900" y1="92" x2="900" y2="724" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ── Activation bars ──────────────────────────────────────── -->
      <rect x="96" y="140" width="8" height="290" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="296" y="140" width="8" height="290" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="496" y="232" width="8" height="154" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="496" y="496" width="8" height="68" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="696" y="556" width="8" height="52" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="896" y="600" width="8" height="124" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- ── Messages ─────────────────────────────────────────────── -->
      <!-- M1 call -->
      <line x1="100" y1="140" x2="300" y2="140" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M2 gateway self: authn/authz -->
      <path d="M300 180 L312 180 Q320 180 320 188 L320 192 Q320 200 312 200 L300 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M3 proxy -->
      <line x1="300" y1="232" x2="500" y2="232" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M4 pure transition function -->
      <path d="M500 272 L512 272 Q520 272 520 280 L520 284 Q520 292 512 292 L500 292" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M5 one transaction -->
      <path d="M500 324 L512 324 Q520 324 520 332 L520 336 Q520 344 512 344 L500 344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M6 return to gateway -->
      <line x1="500" y1="380" x2="300" y2="380" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- M7 return to caller (headline) -->
      <line x1="300" y1="424" x2="100" y2="424" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <!-- M8 relay claim -->
      <path d="M500 504 L512 504 Q520 504 520 512 L520 516 Q520 524 512 524 L500 524" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M9 publish to Kafka -->
      <line x1="500" y1="556" x2="700" y2="556" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <!-- M10 consumer receives -->
      <line x1="700" y1="600" x2="900" y2="600" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <!-- M11 dedupe -->
      <path d="M900 644 L912 644 Q920 644 920 652 L920 656 Q920 664 912 664 L900 664" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M12 release -->
      <path d="M900 696 L912 696 Q920 696 920 704 L920 708 Q920 716 912 716 L900 716" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ── Labels (after arrows, before nodes) ──────────────────── -->
      <rect x="117" y="120" width="166" height="12" fill="#f5f5f5"/>
      <text x="200" y="129" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">POST /api/orders/{id}/cancel</text>

      <rect x="308" y="160" width="166" height="12" fill="#f5f5f5"/>
      <text x="312" y="169" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">verify RS256 · set X-User-Id</text>

      <rect x="343" y="212" width="113" height="12" fill="#f5f5f5"/>
      <text x="400" y="221" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">proxy :8080 → :8083</text>

      <rect x="508" y="252" width="176" height="12" fill="#f5f5f5"/>
      <text x="512" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Transition(order, action, actor)</text>

      <rect x="508" y="304" width="182" height="12" fill="#f5f5f5"/>
      <text x="512" y="313" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">tx: status + history + 2 outbox</text>

      <rect x="338" y="360" width="123" height="12" fill="#f5f5f5"/>
      <text x="400" y="369" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">200 {status:CANCELLED}</text>

      <rect x="122" y="404" width="155" height="12" fill="#f5f5f5"/>
      <text x="200" y="413" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">200 — stock is not back yet</text>

      <rect x="508" y="484" width="171" height="12" fill="#f5f5f5"/>
      <text x="512" y="493" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">claim 100 · SKIP LOCKED · 500ms</text>

      <rect x="514" y="536" width="171" height="12" fill="#f5f5f5"/>
      <text x="600" y="545" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">publish acks=all · key=order_id</text>

      <rect x="741" y="580" width="118" height="12" fill="#f5f5f5"/>
      <text x="800" y="589" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">consume order.events</text>

      <rect x="706" y="624" width="184" height="12" fill="#f5f5f5"/>
      <text x="710" y="633" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">INSERT event_id → processed_events</text>

      <rect x="712" y="676" width="178" height="12" fill="#f5f5f5"/>
      <text x="716" y="685" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FOR UPDATE · qty back · released</text>

      <!-- Editorial insight, in the corridor the gateway just vacated -->
      <text x="20" y="458" fill="#2d3142" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">The buyer's 200 arrives while the stock is still reserved.</text>
      <text x="20" y="478" fill="#2d3142" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">Nothing about the catalog has happened yet.</text>

      <!-- Free-standing notes -->
      <text x="712" y="566" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">OrderStatusChanged + OrderCancelled</text>
      <text x="20" y="690" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">at-least-once: a crash between produce and published_at</text>
      <text x="20" y="704" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">redelivers — processed_events keeps the consumer idempotent</text>

      <!-- ── Nodes (painted last) ─────────────────────────────────── -->
      <rect x="20" y="36" width="160" height="56" fill="#f5f5f5"/>
      <rect x="20" y="36" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="28" y="44" width="36" height="13" rx="2" fill="transparent" stroke="rgba(122,131,153,0.50)" stroke-width="0.8"/>
      <text x="46" y="53" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">ACTOR</text>
      <text x="100" y="74" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Buyer or Seller</text>
      <text x="100" y="86" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cancel reason 1-200</text>

      <rect x="220" y="36" width="160" height="56" fill="#f5f5f5"/>
      <rect x="220" y="36" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="228" y="44" width="45" height="13" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="250" y="53" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">GATEWAY</text>
      <text x="300" y="74" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">gateway</text>
      <text x="300" y="86" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:8080</text>

      <rect x="420" y="36" width="160" height="56" fill="#f5f5f5"/>
      <rect x="420" y="36" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="428" y="44" width="45" height="13" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="450" y="53" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">SERVICE</text>
      <text x="500" y="74" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">order-svc</text>
      <text x="500" y="86" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">order_db · outbox</text>

      <rect x="620" y="36" width="160" height="56" fill="#f5f5f5"/>
      <rect x="620" y="36" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="628" y="44" width="41" height="13" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="648" y="53" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">BROKER</text>
      <text x="700" y="74" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">order.events</text>
      <text x="700" y="86" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">topic · 3 partitions</text>

      <rect x="820" y="36" width="160" height="56" fill="#f5f5f5"/>
      <rect x="820" y="36" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="828" y="44" width="50" height="13" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="853" y="53" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">CONSUMER</text>
      <text x="900" y="74" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">catalog-svc</text>
      <text x="900" y="86" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">catalog_db · skus</text>

      <!-- ── Legend ───────────────────────────────────────────────── -->
      <line x1="20" y1="740" x2="980" y2="740" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="20" y="762" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-transform="uppercase">LEGEND</text>
      <line x1="100" y1="758" x2="120" y2="758" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="128" y="761" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">sync call</text>
      <line x1="260" y1="758" x2="280" y2="758" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="288" y="761" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">return</text>
      <line x1="400" y1="758" x2="420" y2="758" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <text x="428" y="761" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">async event</text>
      <line x1="600" y1="758" x2="620" y2="758" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="628" y="761" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">200 to the caller</text>
      <rect x="760" y="753" width="14" height="10" rx="2" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="782" y="761" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">self step</text>
    </svg>
  </div>
</body>
</html>
