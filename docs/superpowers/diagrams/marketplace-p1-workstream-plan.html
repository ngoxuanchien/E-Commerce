<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Dependency graph · Diagram Design</p>
    <h1>P1 workstream plan: one root, five parallel tracks, one join</h1>

    <svg viewBox="0 0 1180 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="marketplace-p1-workstream-plan-title marketplace-p1-workstream-plan-desc">
      <title id="marketplace-p1-workstream-plan-title">P1 workstream plan: WS0 root, WS1-WS5 parallel, WS6 join</title>
      <desc id="marketplace-p1-workstream-plan-desc">WS0 Foundation and Contracts is the single blocking root that fixes every interface; after it merges, the identity, catalog, order, gateway and web workstreams run in parallel, each owning one directory and mocking its neighbours, and all five join at WS6 Integration and E2E.</desc>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ═══ ZONE (painted first) ═══ -->

      <rect x="24" y="260" width="124" height="12" rx="2" fill="#f5f5f5"/>
      <text x="32" y="269" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">RANK 1 · IN PARALLEL</text>

      <!-- ═══ CONTRACT-CHANGE CHANNEL (routes outside the node stack) ═══ -->
      <path d="M 1124 324 H 1136 Q 1144 324 1144 316 V 48 Q 1144 40 1136 40 H 700 Q 692 40 692 48 V 72"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="844" y="20" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="900" y="29" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONTRACT PR → main</text>
      <text x="800" y="196" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">buf breaking gates api/ proto/ pkg/</text>
      <text x="800" y="212" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">in-flight workstreams rebase afterwards</text>

      <!-- ═══ FAN-OUT (root → five parallel tracks) ═══ -->
      <line x1="448" y1="148" x2="448" y2="224" stroke="#4f5d75" stroke-width="1.2"/>

      <line x1="712" y1="148" x2="712" y2="224" stroke="#4f5d75" stroke-width="1.2"/>

      <line x1="100" y1="224" x2="100" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="340" y1="224" x2="340" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="580" y1="224" x2="580" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="820" y1="224" x2="820" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1060" y1="224" x2="1060" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="589" y="178" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="641" y="187" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONTRACTS FIXED</text>

      <line x1="580" y1="360" x2="580" y2="480" stroke="#4f5d75" stroke-width="1.2"/>

      <line x1="420" y1="480" x2="420" y2="500" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="480" x2="500" y2="500" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <text x="100" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WS1 identity</text>
      <text x="100" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">services/identity/</text>
      <text x="100" y="352" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no mock</text>

      <!-- WS2 -->
      <rect x="276" y="288" width="128" height="72" rx="6" fill="#f5f5f5"/>

      <text x="384" y="303" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1 in</text>
      <text x="340" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WS2 catalog</text>
      <text x="340" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">services/catalog/</text>
      <text x="340" y="352" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fake Identity gRPC</text>

      <!-- WS3 -->
      <rect x="516" y="288" width="128" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="516" y="288" width="128" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="612" y="294" width="24" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="624" y="303" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1 in</text>

      <text x="580" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">services/order/</text>
      <text x="580" y="352" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fake Catalog gRPC</text>

      <text x="1060" y="352" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MSW from OpenAPI</text>

      <rect x="784" y="506" width="28" height="12" rx="2" fill="#f5f5f5" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="798" y="515" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">5 in</text>
      <text x="580" y="534" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WS6 · Integration &amp; E2E</text>
      <text x="580" y="552" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">e2e/ · docs/ · README.md · real stack</text>

      <!-- ═══ LEGEND ═══ -->
      <line x1="32" y1="624" x2="1148" y2="624" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
