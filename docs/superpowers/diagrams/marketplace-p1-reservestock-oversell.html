<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReserveStock, and the guard that stops an oversell</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Marketplace P1 · 2026-09-28</p>
    <h1>ReserveStock, and the guard that stops an oversell</h1>

<svg viewBox="0 0 1080 872" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="marketplace-p1-reservestock-oversell-title marketplace-p1-reservestock-oversell-desc">
  <title id="marketplace-p1-reservestock-oversell-title">ReserveStock, and the guard that stops an oversell</title>
  <desc id="marketplace-p1-reservestock-oversell-desc">Decision flowchart for the ReserveStock gRPC method: an order that already has reservation rows returns immediately, duplicate items are merged and sorted by sku id, each row is decremented by a single UPDATE guarded on active and sufficient stock, and any shortage rolls the whole transaction back with a failed-precondition error naming the shortages; fifty concurrent one-unit reservations against a stock of ten succeed exactly ten times and never drive stock negative.</desc>
  <defs>
    <marker id="marketplace-p1-reservestock-oversell-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="marketplace-p1-reservestock-oversell-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="marketplace-p1-reservestock-oversell-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1080" height="872" fill="#f5f5f5"/>

  <!-- connectors first; every bend an r=8 quarter-arc -->
  <line x1="120" y1="120" x2="120" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#marketplace-p1-reservestock-oversell-arrow)"/>
  <path d="M 190 192 H 292 Q 300 192 300 200 V 232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#marketplace-p1-reservestock-oversell-arrow)"/>
  <line x1="120" y1="232" x2="120" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#marketplace-p1-reservestock-oversell-arrow)"/>
  <line x1="120" y1="340" x2="120" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#marketplace-p1-reservestock-oversell-arrow)"/>
  <path d="M 230 412 H 292 Q 300 412 300 404 V 372 Q 300 364 292 364 H 188 Q 180 364 180 372 V 380" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#marketplace-p1-reservestock-oversell-arrow)"/>
  <line x1="120" y1="444" x2="120" y2="488" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#marketplace-p1-reservestock-oversell-arrow)"/>
  <path d="M 190 528 H 330 Q 338 528 338 536 V 564 Q 338 572 346 572 H 362 Q 370 572 370 580" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#marketplace-p1-reservestock-oversell-arrow)"/>
  <line x1="120" y1="568" x2="120" y2="612" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#marketplace-p1-reservestock-oversell-arrow)"/>
  <line x1="120" y1="676" x2="120" y2="708" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#marketplace-p1-reservestock-oversell-arrow)"/>

  <!-- branch labels, 6-10px clear of their own stroke -->
  <rect x="240" y="172" width="24" height="12" rx="2" fill="#f5f5f5"/>
  <text x="252" y="181" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">YES</text>

  <rect x="130" y="248" width="22" height="12" rx="2" fill="#f5f5f5"/>
  <text x="141" y="257" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">NO</text>

  <rect x="286" y="508" width="24" height="12" rx="2" fill="#f5f5f5"/>
  <text x="298" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">YES</text>

  <rect x="130" y="584" width="22" height="12" rx="2" fill="#f5f5f5"/>
  <text x="141" y="593" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">NO</text>

  <rect x="310" y="380" width="76" height="12" rx="2" fill="#f5f5f5"/>
  <text x="348" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEXT ITEM</text>

  <rect x="130" y="460" width="108" height="12" rx="2" fill="#f5f5f5"/>
  <text x="184" y="469" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">0 ROWS = SHORTAGE</text>


  <!-- Start -->
  <rect x="40" y="64" width="160" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="120" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ReserveStock</text>
  <text x="120" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">order_id, items</text>

  <!-- Decision 1 -->
  <polygon points="120,152 190,192 120,232 50,192" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="120" y="190" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">rows for this</text>
  <text x="120" y="203" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">order_id?</text>

  <!-- Return OK -->
  <rect x="170" y="232" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="270" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Return OK</text>
  <text x="270" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">idempotent per order</text>

  <!-- Merge + sort -->
  <rect x="20" y="276" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="120" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Merge dupes, sort</text>
  <text x="120" y="314" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ORDER BY sku_id</text>
  <text x="120" y="330" fill="#7a8399" font-size="11" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">deadlock avoidance</text>

  <!-- Focal: the guarded decrement -->
  <rect x="10" y="380" width="220" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="10" y="380" width="220" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="120" y="402" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UPDATE skus</text>
  <text x="120" y="418" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">stock = stock - $q</text>
  <text x="120" y="434" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WHERE id AND active AND stock &gt;= $q</text>

  <!-- Decision 2 -->
  <polygon points="120,488 190,528 120,568 50,528" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="120" y="526" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">any</text>
  <text x="120" y="539" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">shortage?</text>

  <!-- ROLLBACK (72 tall so the last line clears the border) -->
  <rect x="370" y="576" width="260" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="500" y="598" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ROLLBACK</text>
  <text x="500" y="616" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FAILED_PRECONDITION</text>
  <text x="500" y="632" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">InsufficientStock{shortages}</text>

  <!-- Insert + commit -->
  <rect x="20" y="612" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="120" y="634" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Insert reserved, commit</text>
  <text x="120" y="650" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stock_reservations</text>
  <text x="120" y="666" fill="#7a8399" font-size="11" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">all-or-nothing</text>

  <!-- End -->
  <rect x="20" y="708" width="200" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="120" y="732" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OK · stock held</text>
  <text x="120" y="748" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one transaction</text>

  <text x="1040" y="200" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">the check lives in the WHERE clause, not in Go:</text>
  <text x="1040" y="220" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">a row that does not qualify is never decremented.</text>
  <path d="M 700 226 H 660 Q 652 226 652 234 V 462 Q 652 470 644 470 H 254 Q 246 470 246 462 V 448 Q 246 440 238 440" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="234" cy="440" r="2" fill="#2d3142"/>

  <text x="1040" y="660" fill="#eb6c36" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">fifty calls, stock 10, one unit each: exactly ten</text>
  <text x="1040" y="680" fill="#eb6c36" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">succeed, and stock lands on zero, never below.</text>
  <path d="M 700 686 H 660 Q 652 686 652 678 V 620 Q 652 612 644 612 H 636" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="632" cy="612" r="2" fill="#eb6c36"/>


  <line x1="40" y1="800" x2="1040" y2="800" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="816" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
  <rect x="40" y="830" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="72" y="840" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end</text>
  <rect x="180" y="830" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="212" y="840" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>
  <polygon points="304,836 316,830 328,836 316,842" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="340" y="840" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>
  <rect x="436" y="830" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="468" y="840" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">The guard</text>
  <line x1="576" y1="836" x2="600" y2="836" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#marketplace-p1-reservestock-oversell-arrow)"/>
  <text x="608" y="840" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Branch</text>
  <line x1="700" y1="836" x2="724" y2="836" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#marketplace-p1-reservestock-oversell-arrow)"/>
  <text x="732" y="840" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Loop</text>
</svg>
  </div>
</body>
</html>
