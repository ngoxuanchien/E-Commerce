<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refresh token rotation and reuse detection</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>Refresh token rotation, and the reuse that revokes a family</h1>

    <svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="marketplace-p1-refresh-token-rotation-title marketplace-p1-refresh-token-rotation-desc">
      <title id="marketplace-p1-refresh-token-rotation-title">Refresh token rotation and reuse detection</title>
      <desc id="marketplace-p1-refresh-token-rotation-desc">A valid refresh token is revoked and replaced by a new token in the same family with roles re-read from the database; presenting an already-revoked token revokes the entire family as theft detection.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ── ALT frame: reuse of a revoked token ──────────────────── -->
      <rect x="88" y="416" width="812" height="168" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="88" y="416" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="108" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="140" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[token already revoked]</text>

      <!-- ── Lifelines ────────────────────────────────────────────── -->
      <line x1="140" y1="92" x2="140" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="420" y1="92" x2="420" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="700" y1="92" x2="700" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="900" y1="92" x2="900" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ── Activation bars ──────────────────────────────────────── -->
      <rect x="136" y="140" width="8" height="428" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="416" y="184" width="8" height="384" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="696" y="228" width="8" height="152" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="696" y="452" width="8" height="116" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="896" y="528" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- ── Messages ─────────────────────────────────────────────── -->
      <!-- M1 SPA restores session on load -->
      <line x1="140" y1="140" x2="420" y2="140" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M2 hash lookup -->
      <line x1="420" y1="184" x2="700" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M3 row + user_roles -->
      <line x1="700" y1="228" x2="900" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M4 return db -->
      <line x1="900" y1="272" x2="700" y2="272" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- M5 return svc: re-issue -->
      <line x1="700" y1="316" x2="420" y2="316" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- M6 self: revoke old + write replacement -->
      <path d="M420 348 L432 348 Q440 348 440 356 L440 360 Q440 368 432 368 L420 368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M7 headline: 200 + rotated cookie -->
      <line x1="420" y1="400" x2="140" y2="400" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

      <!-- M8 reuse: the old token comes back (a second device) -->
      <line x1="140" y1="452" x2="420" y2="452" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M9 revoked_at already set? -->
      <line x1="420" y1="496" x2="700" y2="496" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M10 revoke the whole family -->
      <line x1="700" y1="540" x2="900" y2="540" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M11 401 -->
      <line x1="420" y1="568" x2="140" y2="568" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- ── Labels (after arrows, before nodes) ──────────────────── -->
      <rect x="152" y="120" width="256" height="12" fill="#f5f5f5"/>
      <text x="280" y="129" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">POST /api/auth/refresh (cookie)</text>

      <rect x="504" y="164" width="152" height="12" fill="#f5f5f5"/>
      <text x="580" y="173" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">sha256(token) → row</text>

      <rect x="716" y="208" width="168" height="12" fill="#f5f5f5"/>
      <text x="800" y="217" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">user_roles — re-read</text>

      <rect x="752" y="252" width="136" height="12" fill="#f5f5f5"/>
      <text x="820" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">row + current roles</text>

      <rect x="504" y="296" width="152" height="12" fill="#f5f5f5"/>
      <text x="580" y="305" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">new family_id = same</text>

      <rect x="508" y="328" width="204" height="12" fill="#f5f5f5"/>
      <text x="512" y="337" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">revoke old · replaced_by = new</text>

      <rect x="160" y="380" width="200" height="12" fill="#f5f5f5"/>
      <text x="260" y="389" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">200 · Set-Cookie — rotated</text>

      <rect x="152" y="432" width="196" height="12" fill="#f5f5f5"/>
      <text x="250" y="441" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">POST /refresh — the revoked token</text>

      <rect x="508" y="476" width="128" height="12" fill="#f5f5f5"/>
      <text x="572" y="485" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">revoked_at set → reuse</text>

      <rect x="716" y="520" width="184" height="12" fill="#f5f5f5"/>
      <text x="808" y="529" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">revoke every row in family_id</text>

      <rect x="232" y="548" width="176" height="12" fill="#f5f5f5"/>
      <text x="320" y="557" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">401 UNAUTHENTICATED</text>

      <!-- Editorial insight, in the corridor the SPA just vacated -->
      <text x="20" y="624" fill="#2d3142" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">Reuse is only detectable because every rotation revokes the token it replaces.</text>
      <text x="20" y="644" fill="#2d3142" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">The stolen copy is now the one that looks expired — so the family dies, not just the token.</text>

      <!-- Free-standing notes -->
      <text x="20" y="672" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">cookie: HttpOnly · Secure · SameSite=Lax · Path=/api/auth · Max-Age 30d · only sha256 is stored</text>
      <text x="20" y="688" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">roles re-read from the DB, so opening a shop and refreshing is enough to pick up the seller role</text>

      <!-- ── Nodes (painted last) ─────────────────────────────────── -->
      <rect x="60" y="36" width="160" height="56" fill="#f5f5f5"/>
      <rect x="60" y="36" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="68" y="44" width="36" height="13" rx="2" fill="transparent" stroke="rgba(122,131,153,0.50)" stroke-width="0.8"/>
      <text x="86" y="53" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">ACTOR</text>
      <text x="140" y="74" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Browser</text>
      <text x="140" y="86" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cookie only, no header</text>

      <rect x="340" y="36" width="160" height="56" fill="#f5f5f5"/>
      <rect x="340" y="36" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="348" y="44" width="45" height="13" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="370" y="53" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">SERVICE</text>
      <text x="420" y="74" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">identity-svc</text>
      <text x="420" y="86" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:8081</text>

      <rect x="620" y="36" width="160" height="56" fill="#f5f5f5"/>
      <rect x="620" y="36" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="628" y="44" width="34" height="13" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="645" y="53" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">APP</text>
      <text x="700" y="74" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">AuthService</text>
      <text x="700" y="86" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Refresh · Logout</text>

      <rect x="820" y="36" width="160" height="56" fill="#f5f5f5"/>
      <rect x="820" y="36" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="828" y="44" width="28" height="13" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="842" y="53" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">DB</text>
      <text x="900" y="74" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">identity_db</text>
      <text x="900" y="86" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">refresh_tokens</text>

      <!-- ── Legend ───────────────────────────────────────────────── -->
      <line x1="20" y1="700" x2="980" y2="700" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="20" y="722" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-transform="uppercase">LEGEND</text>
      <line x1="100" y1="718" x2="120" y2="718" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="128" y="721" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">sync call</text>
      <line x1="260" y1="718" x2="280" y1="718" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="288" y="721" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">return</text>
      <line x1="400" y1="718" x2="420" y1="718" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <text x="428" y="721" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">rotated cookie</text>
      <rect x="600" y="713" width="14" height="10" rx="2" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="622" y="721" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">self step</text>
      <rect x="740" y="710" width="14" height="16" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="762" y="721" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">alt fragment</text>
    </svg>
  </div>
</body>
</html>
