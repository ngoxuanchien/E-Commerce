<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local stack: four ports reach the host</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Deployment · Diagram Design</p>
    <h1>Local stack: four ports reach the host</h1>

    <svg viewBox="0 0 1040 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="marketplace-p1-local-infrastructure-title marketplace-p1-local-infrastructure-desc">
      <title id="marketplace-p1-local-infrastructure-title">Local stack: four ports reach the host</title>
      <desc id="marketplace-p1-local-infrastructure-desc">Deployment diagram of the specified local Docker Compose stack: a host boundary publishing only the gateway, the web container, the Jaeger UI and the MinIO API, an application zone holding the four Go services behind the gateway on unpublished ports, and a data zone with Postgres, Redis and Kafka, with health endpoints and Makefile targets.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- =================================================================
           ZONES — drawn first, before paths, labels and nodes.
           HOST is the trust boundary. Only four mappings cross it.
           ================================================================= -->
      <rect x="40" y="48" width="960" height="200" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="56" y="40" width="140" height="16" fill="#f5f5f5"/>
      <text x="64" y="52" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HOST · DOCKER</text>
      <text x="212" y="52" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">project: marketplace</text>

      <rect x="40" y="276" width="600" height="252" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="56" y="268" width="88" height="16" fill="#f5f5f5"/>
      <text x="64" y="280" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PROFILE APP</text>

      <rect x="672" y="276" width="328" height="252" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="688" y="268" width="56" height="16" fill="#f5f5f5"/>
      <text x="696" y="280" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">INFRA</text>

      <!-- =================================================================
           NETWORK PATHS — seven, behind the nodes. Attach points on any
           shared edge are 88px apart, well over the 12px minimum.
           ================================================================= -->

      <!-- P1: host reaches the web container (published 3000 -> :80) -->
      <line x1="112" y1="244" x2="112" y2="186" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- P2: web proxies /api to the gateway (in-network) -->
      <line x1="248" y1="134" x2="352" y2="134" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- P3: host reaches the gateway (the only published Go port) -->
      <line x1="428" y1="244" x2="428" y2="186" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- P4: host reaches MinIO -->
      <line x1="900" y1="244" x2="900" y2="186" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- P5: host reaches the Jaeger UI -->
      <line x1="760" y1="244" x2="760" y2="186" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- P6: every service exports spans to Jaeger OTLP — internal only -->
      <path d="M 480 340 L 660 340 Q 668 340 668 332 L 668 156 Q 668 148 676 148 L 694 148" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <!-- P7: the app zone's only other dependency — the data tier -->
      <line x1="484" y1="428" x2="698" y2="428" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Path labels — 6–10px above their own stroke, clear of every node -->
      <rect x="120" y="208" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="164" y="217" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP :3000 → :80</text>

      <rect x="252" y="114" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="300" y="123" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROXY /API :8080</text>

      <rect x="436" y="208" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="217" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP :8080</text>

      <rect x="908" y="208" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="942" y="217" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">API :9000</text>

      <rect x="768" y="208" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="798" y="217" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UI :16686</text>

      <rect x="536" y="320" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="570" y="329" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OTLP :4317</text>

      <rect x="554" y="408" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="592" y="417" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO HOST PORT</text>

      <!-- =================================================================
           HOST NODES — the published set
           ================================================================= -->

      <!-- web -->
      <rect x="64" y="88" width="180" height="92" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="88" width="180" height="92" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="96" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="100" y="105" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONTAINER</text>
      <text x="154" y="130" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">web</text>
      <rect x="72" y="140" width="164" height="20" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="80" y="154" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">nginx · SPA</text>
      <text x="228" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">:80</text>
      <text x="72" y="172" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">docker-compose.web.yml</text>

      <!-- gateway (focal) -->
      <rect x="356" y="88" width="180" height="92" rx="6" fill="#f5f5f5"/>
      <rect x="356" y="88" width="180" height="92" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="364" y="96" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="380" y="105" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="446" y="130" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">gateway</text>
      <rect x="364" y="140" width="164" height="20" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="372" y="154" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">http</text>
      <text x="520" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">x1</text>
      <text x="364" y="172" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">the only public entry · no DB</text>

      <!-- jaeger -->
      <rect x="700" y="88" width="136" height="92" rx="6" fill="#f5f5f5"/>
      <rect x="700" y="88" width="136" height="92" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="708" y="96" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="734" y="105" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MANAGED</text>
      <text x="768" y="130" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">jaeger</text>
      <rect x="708" y="140" width="120" height="20" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="716" y="154" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">all-in-one</text>
      <text x="820" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">2.21</text>
      <text x="708" y="172" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">OTLP :4317 is internal</text>

      <!-- minio -->
      <rect x="848" y="88" width="136" height="92" rx="6" fill="#f5f5f5"/>
      <rect x="848" y="88" width="136" height="92" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="856" y="96" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="882" y="105" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MANAGED</text>
      <text x="916" y="130" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">minio</text>
      <rect x="856" y="140" width="120" height="20" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="864" y="154" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">product-images</text>
      <text x="968" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">x1</text>
      <text x="856" y="172" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">console :9001 · public-read</text>

      <!-- =================================================================
           APP NODE — the four Go services behind the gateway
           ================================================================= -->
      <rect x="72" y="316" width="408" height="196" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="316" width="408" height="196" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="80" y="324" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="96" y="333" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="464" y="333" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">DISTROLESS · ENTRYPOINT ["/server"]</text>
      <text x="276" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">go services</text>

      <text x="88" y="384" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">gateway</text>
      <text x="464" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">:8080</text>
      <text x="88" y="404" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">identity</text>
      <text x="464" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">:8081 · :9081</text>
      <text x="88" y="424" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">catalog</text>
      <text x="464" y="424" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">:8082 · :9082</text>
      <text x="88" y="444" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">order</text>
      <text x="464" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">:8083 · :9083</text>

      <line x1="88" y1="460" x2="464" y2="460" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="88" y="476" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace">no published ports · X-User-Id trusted from gateway</text>
      <text x="88" y="492" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace">/healthz liveness · /readyz deps 2s · migrations on start</text>
      <text x="88" y="508" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace">docker healthcheck: /server healthcheck</text>

      <!-- =================================================================
           DATA NODE — the rest of the infra zone, one card, three lines
           ================================================================= -->
      <rect x="704" y="316" width="280" height="164" rx="6" fill="#f5f5f5"/>
      <rect x="704" y="316" width="280" height="164" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="712" y="324" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="732" y="333" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
      <text x="844" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">local data tier</text>

      <text x="720" y="384" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">postgres · 17-alpine · 3 databases</text>
      <text x="720" y="406" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">redis · 7-alpine · cart hash</text>
      <text x="720" y="428" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">kafka · 4.3.1 KRaft · order.events</text>

      <line x1="720" y1="440" x2="968" y2="440" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="720" y="456" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace">init jobs: kafka-topics.sh · mc mb product-images</text>
      <text x="720" y="470" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace">AUTO_CREATE_TOPICS_ENABLE=false · RF 1</text>

      <!-- =================================================================
           ANNOTATIONS + LEGEND
           ================================================================= -->
      <text x="40" y="558" fill="#2d3142" font-size="14 font-style="italic" font-family="'Instrument Serif', serif">Only the gateway is reachable from outside — so the services trust X-User-* headers.</text>
      <text x="40" y="578" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">SPECIFIED, NOT RUNNING — deploy/ IS WS0 TASK 17 · CORS ORIGINS: :3000 AND VITE :5173</text>

      <line x1="40" y1="596" x2="1000" y2="596" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="612" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="627" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>

      <line x1="460" y1="631" x2="488" y2="631" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="496" y="635" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Crosses the host boundary</text>

      <line x1="700" y1="631" x2="728" y2="631" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

      <text x="40" y="672" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em">MAKE</text>
