<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Six modules, one repo, no shared go.mod</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Nested · Diagram Design</p>
    <h1>Six modules, one repo, no shared go.mod</h1>

    <svg viewBox="0 0 1000 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="marketplace-p1-repo-layout-title marketplace-p1-repo-layout-desc">
      <title id="marketplace-p1-repo-layout-title">Six modules, one repo, no shared go.mod</title>
      <desc id="marketplace-p1-repo-layout-desc">Nested diagram of the Marketplace P1 Go workspace: a root ring holding go.work and tooling, the shared pkg module with twelve libraries, generated code and proto contracts, OpenAPI and event schemas, and a services ring containing gateway, identity, catalog and order each with their own go.mod.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- =================================================================
           CONTAINMENT RINGS — the whole relationship grammar of this diagram.
           Level 1: repo root. Level 2: top-level directories.
           Level 3: one ring per service module inside services/.
           ================================================================= -->

      <!-- Level 1 — repo root -->
      <rect x="40" y="48" width="920" height="532" rx="8" fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="56" y="40" width="80" height="16" fill="#f5f5f5"/>
      <text x="64" y="52" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">e-commerce/</text>

      <text x="72" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">go.work · Makefile · .github/workflows/ci.yml · .gitignore · .editorconfig</text>
      <text x="72" y="92" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">module path: github.com/ngoxuanchien/e-commerce/&lt;dir&gt;</text>

      <!-- Level 2 — shared libraries (the only directory 12 items big enough to need a list) -->
      <rect x="72" y="112" width="376" height="100" rx="8" fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>
      <rect x="88" y="104" width="56" height="16" fill="#f5f5f5"/>
      <text x="96" y="116" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">pkg/</text>
      <text x="88" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">module .../pkg</text>
      <text x="88" y="182" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">config · logx · httpx · authctx · pgxx · outbox</text>
      <text x="88" y="198" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">kafkax · event · grpcx · otelx · testutil · server</text>

      <!-- Level 2 — generated code -->
      <rect x="472" y="112" width="208" height="100" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
      <rect x="488" y="104" width="48" height="16" fill="#f5f5f5"/>
      <text x="496" y="116" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">gen/</text>
      <text x="488" y="142" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">module .../gen</text>
      <text x="488" y="166" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">generated from proto</text>
      <text x="488" y="184" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">committed to the repo</text>
      <text x="488" y="202" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">no codegen on build</text>

      <!-- Level 2 — proto contracts -->
      <rect x="704" y="112" width="224" height="100" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
      <rect x="720" y="104" width="64" height="16" fill="#f5f5f5"/>
      <text x="728" y="116" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">proto/</text>
      <text x="720" y="142" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">contract source of truth</text>
      <text x="720" y="166" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">buf.yaml · buf.gen.yaml</text>
      <text x="720" y="184" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">catalog/v1 · identity/v1</text>
      <text x="720" y="202" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">breaking: FILE</text>

      <!-- Level 2 — OpenAPI + event schemas -->
      <rect x="72" y="236" width="856" height="64" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
      <rect x="88" y="228" width="48" height="16" fill="#f5f5f5"/>
      <text x="96" y="240" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">api/</text>
      <text x="88" y="260" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">openapi/  common.yaml · identity.yaml · catalog.yaml · order.yaml</text>
      <text x="88" y="280" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">events/   JSON Schemas for the Kafka envelope</text>

      <!-- Level 2 — services: the focal ring (one go.mod each) -->
      <rect x="72" y="324" width="856" height="168" rx="8" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="88" y="316" width="80" height="16" fill="#f5f5f5"/>
      <text x="96" y="328" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">services/</text>
      <rect x="556" y="316" width="240" height="16" fill="#f5f5f5"/>
      <text x="564" y="328" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em">EACH ITS OWN GO.MOD — ONE PER WORKSTREAM</text>

      <!-- Level 3 — the four service modules -->
      <rect x="88" y="356" width="188" height="120" rx="8" fill="#f5f5f5"/>
      <rect x="88" y="356" width="188" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="88" y="348" width="72" height="16" fill="#f5f5f5"/>
      <text x="96" y="360" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">gateway</text>
      <text x="96" y="384" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">module .../gateway</text>
      <text x="96" y="408" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">cmd/server/main.go</text>
      <text x="96" y="426" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">internal/{domain,app,</text>
      <text x="96" y="442" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">adapter/*} · migrations/</text>
      <text x="96" y="458" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">Dockerfile · go.mod</text>

      <rect x="300" y="356" width="188" height="120" rx="8" fill="#f5f5f5"/>
      <rect x="300" y="356" width="188" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="300" y="348" width="72" height="16" fill="#f5f5f5"/>
      <text x="308" y="360" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">identity</text>
      <text x="308" y="384" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">module .../identity</text>
      <text x="308" y="408" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">cmd/server/main.go</text>
      <text x="308" y="426" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">internal/{domain,app,</text>
      <text x="308" y="442" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">adapter/*} · migrations/</text>
      <text x="308" y="458" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">Dockerfile · go.mod</text>

      <rect x="512" y="356" width="188" height="120" rx="8" fill="#f5f5f5"/>
      <rect x="512" y="356" width="188" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="512" y="348" width="64" height="16" fill="#f5f5f5"/>
      <text x="520" y="360" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">catalog</text>
      <text x="520" y="384" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">module .../catalog</text>
      <text x="520" y="408" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">cmd/server/main.go</text>
      <text x="520" y="426" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">internal/{domain,app,</text>
      <text x="520" y="442" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">adapter/*} · migrations/</text>
      <text x="520" y="458" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">Dockerfile · go.mod</text>

      <rect x="724" y="356" width="188" height="120" rx="8" fill="#f5f5f5"/>
      <rect x="724" y="356" width="188" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="724" y="348" width="56" height="16" fill="#f5f5f5"/>
      <text x="732" y="360" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">order</text>
      <text x="732" y="384" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">module .../order</text>
      <text x="732" y="408" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">cmd/server/main.go</text>
      <text x="732" y="426" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">internal/{domain,app,</text>
      <text x="732" y="442" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">adapter/*} · migrations/</text>
      <text x="732" y="458" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">Dockerfile · go.mod</text>

      <!-- Level 2 — deploy, web, e2e -->
      <rect x="72" y="516" width="376" height="48" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
      <rect x="88" y="508" width="76" height="16" fill="#f5f5f5"/>
      <text x="96" y="520" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">deploy/</text>
      <text x="88" y="546" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">docker-compose.yml · postgres/init.sql · secrets/ (gitignored)</text>

      <rect x="472" y="516" width="208" height="48" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
      <rect x="488" y="508" width="48" height="16" fill="#f5f5f5"/>
      <text x="496" y="520" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">web/</text>
      <text x="488" y="546" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">WS5 · React SPA</text>

      <rect x="704" y="516" width="224" height="48" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
      <rect x="720" y="508" width="48" height="16" fill="#f5f5f5"/>
      <text x="728" y="520" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">e2e/</text>
      <text x="720" y="546" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">WS6 · Playwright + API smoke</text>

      <!-- =================================================================
           EDITORIAL CALLOUT — the finding the layout exists to express.
           ================================================================= -->
      <text x="960" y="28" fill="#eb6c36" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">one module per workstream — nobody edits another’s go.mod</text>

      <!-- LEGEND — horizontal strip after all rings -->
      <line x1="40" y1="600" x2="960" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="629" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="637" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Service modules — one go.mod each</text>

      <rect x="300" y="629" width="14" height="10" rx="2" fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>
      <text x="320" y="637" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Shared module (pkg, gen)</text>

      <rect x="500" y="629" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
      <text x="520" y="637" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Contract / tooling directory</text>

      <text x="740" y="637" fill="#7a8399" font-size="8.5" font-family="'Geist', sans-serif">containment only — no connectors</text>
    </svg>
  </div>
</body>
</html>
