<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P1 through P5, and what each phase unlocks</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Timeline · Diagram Design</p>
    <h1>Five phases, and the one that makes the rest possible</h1>

    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="marketplace-p1-roadmap-title marketplace-p1-roadmap-desc">
      <title id="marketplace-p1-roadmap-title">P1 through P5, and what each phase unlocks</title>
      <desc id="marketplace-p1-roadmap-desc">Phase 1 builds identity, catalog, order, gateway and web for a cash-on-delivery marketplace; phase 2 adds payment and escrow; phase 3 adds reviews and notifications; phase 4 adds the admin panel; phase 5 adds search, chat and Kubernetes.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Baseline -->
      <line x1="40" y1="300" x2="960" y2="300" stroke="#4f5d75" stroke-width="1"/>

      <!-- Tick marks + phase labels below -->
      <line x1="120" y1="300" x2="120" y2="312" stroke="#4f5d75" stroke-width="1"/>
      <text x="120" y="332" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">P1</text>
      <line x1="320" y1="300" x2="320" y2="312" stroke="#4f5d75" stroke-width="1"/>
      <text x="320" y="332" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">P2</text>
      <line x1="520" y1="300" x2="520" y2="312" stroke="#4f5d75" stroke-width="1"/>
      <text x="520" y="332" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">P3</text>
      <line x1="720" y1="300" x2="720" y2="312" stroke="#4f5d75" stroke-width="1"/>
      <text x="720" y="332" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">P4</text>
      <line x1="900" y1="300" x2="900" y2="312" stroke="#4f5d75" stroke-width="1"/>
      <text x="900" y="332" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">P5</text>

      <!-- ── P1 block (focal) ────────────────────────────────────── -->
      <rect x="40" y="212" width="160" height="60" fill="#f5f5f5"/>
      <rect x="40" y="212" width="160" height="60" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="48" y="220" width="30" height="13" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="63" y="229" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">NOW</text>
      <text x="120" y="248" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Identity · Catalog</text>
      <text x="120" y="264" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Order · Gateway · Web</text>

      <line x1="120" y1="272" x2="120" y2="294" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="120" cy="300" r="6" fill="#eb6c36" stroke="#eb6c36" stroke-width="1"/>

      <!-- P2 -->
      <line x1="320" y1="234" x2="320" y2="294" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="320" cy="300" r="4" fill="#4f5d75"/>
      <text x="320" y="222" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Payment · Escrow</text>
      <text x="320" y="204" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VNPay / Stripe sandbox</text>
      <text x="320" y="248" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">seller wallet · commission</text>

      <!-- P3 -->
      <line x1="520" y1="234" x2="520" y2="294" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="520" cy="300" r="4" fill="#4f5d75"/>
      <text x="520" y="222" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Reviews · Notifications</text>
      <text x="520" y="204" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ratings · email + WebSocket</text>
      <text x="520" y="248" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">a second event consumer</text>

      <!-- P4 -->
      <line x1="720" y1="234" x2="720" y2="294" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="720" cy="300" r="4" fill="#4f5d75"/>
      <text x="720" y="222" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Admin panel</text>
      <text x="720" y="204" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">moderation · categories</text>
      <text x="720" y="248" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">analytics</text>

      <!-- P5 -->
      <line x1="900" y1="234" x2="900" y2="294" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="900" cy="300" r="4" fill="#4f5d75"/>
      <text x="900" y="222" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Search · Chat · K8s</text>
      <text x="900" y="204" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Elasticsearch · buyer–seller chat</text>
      <text x="900" y="248" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Helm</text>

      <!-- ── Below the axis: what P1 actually had to get right ────── -->
      <path d="M120 344 L120 380" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,3"/>

      <rect x="40" y="380" width="200" height="80" fill="#f5f5f5"/>
      <rect x="40" y="380" width="200" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="48" y="388" width="42" height="13" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="69" y="397" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">P1 ASK</text>
      <text x="140" y="416" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Stock never</text>
      <text x="140" y="432" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">goes negative</text>
      <text x="140" y="450" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reserve · outbox · sweeper</text>

      <rect x="264" y="380" width="200" height="80" fill="#f5f5f5"/>
      <rect x="264" y="380" width="200" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="272" y="388" width="46" height="13" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="295" y="397" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">SCOPE</text>
      <text x="364" y="416" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">COD only</text>
      <text x="364" y="436" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VND as int64 · Vietnamese UI</text>
      <text x="364" y="450" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">local Docker Compose</text>

      <rect x="488" y="380" width="200" height="80" fill="#f5f5f5"/>
      <rect x="488" y="380" width="200" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="496" y="388" width="34" height="13" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="513" y="397" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">WHY</text>
      <text x="588" y="416" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Portfolio project</text>
      <text x="588" y="436" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one small Shopee, built</text>
      <text x="588" y="450" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">to be read by a reviewer</text>

      <rect x="712" y="380" width="200" height="80" fill="#f5f5f5"/>
      <rect x="712" y="380" width="200" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="720" y="388" width="34" height="13" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="737" y="397" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">KEY</text>
      <text x="812" y="416" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Contract-first</text>
      <text x="812" y="436" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WS0 fixes every interface;</text>
      <text x="812" y="450" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WS1-WS5 then run parallel</text>

      <!-- Editorial insight -->
      <text x="40" y="512" fill="#2d3142" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">P1 is the only phase that has to be finished before any of the others can start.</text>
      <text x="40" y="532" fill="#2d3142" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">Everything past it is additive: a new service, a new event, a new page — never a change to what already works.</text>

      <!-- Free-standing notes -->
      <text x="40" y="562" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">the phases are ordered by dependency, not by date — no durations were ever committed to</text>
      <text x="40" y="578" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">P2 is the first phase that touches money movement, which is why escrow and commission arrive together</text>

      <!-- ── Legend ───────────────────────────────────────────────── -->
      <line x1="40" y1="596" x2="960" y2="596" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="40" y="618" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-transform="uppercase">LEGEND</text>
      <circle cx="120" cy="614" r="6" fill="#eb6c36"/>
      <text x="136" y="617" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">the phase in build</text>
      <circle cx="280" cy="614" r="4" fill="#4f5d75"/>
      <text x="296" y="617" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">planned phase</text>
      <rect x="440" y="609" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="462" y="617" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">the constraint P1 carries</text>
      <line x1="700" y1="614" x2="720" y1="614" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="728" y="617" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">link to the detail</text>
    </svg>
  </div>
</body>
</html>
