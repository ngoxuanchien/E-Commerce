<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The access token lives in memory and dies with the tab</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>The access token lives in memory and dies with the tab</h1>

    <svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="marketplace-p1-web-token-lifecycle-title marketplace-p1-web-token-lifecycle-desc">
      <title id="marketplace-p1-web-token-lifecycle-title">The access token lives in memory and dies with the tab</title>
      <desc id="marketplace-p1-web-token-lifecycle-desc">The single-page app keeps the access token in memory only, restores the session on load with the refresh cookie, and on a 401 runs a single-flight refresh shared by every waiting request before retrying the original call once.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ── OPT frame: a 401 came back ───────────────────────────── -->
      <rect x="188" y="368" width="704" height="184" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="188" y="368" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="208" y="380" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
      <text x="240" y="380" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[the call came back 401]</text>

      <!-- ── Lifelines ────────────────────────────────────────────── -->
      <line x1="260" y1="92" x2="260" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="540" y1="92" x2="540" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="820" y1="92" x2="820" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ── Activation bars ──────────────────────────────────────── -->
      <rect x="256" y="140" width="8" height="412" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="536" y="184" width="8" height="368" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="536" y="420" width="8" height="76" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="816" y="272" width="8" height="52" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- ── Messages ─────────────────────────────────────────────── -->
      <!-- M1 on app load -->
      <line x1="260" y1="140" x2="540" y2="140" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M2 the SPA hands its own cookie -->
      <path d="M540 184 L552 184 Q560 184 560 192 L560 196 Q560 204 552 204 L540 204" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M3 proxy -->
      <line x1="540" y1="228" x2="820" y2="228" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M4 200 + token -->
      <line x1="820" y1="272" x2="540" y2="272" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- M5 token into memory only -->
      <path d="M540 316 L552 316 Q560 316 560 324 L560 328 Q560 336 552 336 L540 336" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- M6 reload: memory is empty, cookie is not -->
      <line x1="260" y1="380" x2="540" y2="380" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M7 401 -->
      <line x1="540" y1="424" x2="260" y2="424" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- M8 single-flight refresh: only ONE goes out -->
      <path d="M260 456 L240 456 L240 496 L536 496 L536 496" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- M9 the other 2 callers wait on the same promise -->
      <path d="M260 500 L228 500 Q212 500 212 516 L212 520 Q212 528 220 528 L244 528" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M10 retry the original call -->
      <path d="M260 480 L228 480 L228 452 L536 452" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ── Labels ───────────────────────────────────────────────── -->
      <rect x="300" y="120" width="200" height="12" fill="#f5f5f5"/>
      <text x="400" y="129" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">app load · session gone in JS</text>

      <rect x="556" y="164" width="176" height="12" fill="#f5f5f5"/>
      <text x="644" y="173" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">forwards HttpOnly cookie</text>

      <rect x="600" y="208" width="136" height="12" fill="#f5f5f5"/>
      <text x="668" y="217" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">identity-svc :8081</text>

      <rect x="640" y="252" width="160" height="12" fill="#f5f5f5"/>
      <text x="720" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">200 access + rotated cookie</text>

      <rect x="560" y="296" width="204" height="12" fill="#f5f5f5"/>
      <text x="564" y="305" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">access token → memory, never storage</text>

      <rect x="300" y="360" width="192" height="12" fill="#f5f5f5"/>
      <text x="396" y="369" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">F5 · memory is empty again</text>

      <rect x="300" y="404" width="160" height="12" fill="#f5f5f5"/>
      <text x="380" y="413" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">401 UNAUTHENTICATED</text>

      <rect x="264" y="476" width="248" height="12" fill="#f5f5f5"/>
      <text x="388" y="485" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">single-flight refresh — one request</text>

      <rect x="248" y="508" width="204" height="12" fill="#f5f5f5"/>
      <text x="350" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">3 in flight → 1 network call</text>

      <text x="556" y="446" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">retry the original call — once</text>

      <!-- Editorial insight -->
      <text x="20" y="612" fill="#2d3142" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">Three components fire at once. Without the single-flight guard the refresh cookie would be presented</text>
      <text x="20" y="632" fill="#2d3142" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">three times, two of them would look like token theft and kill the session the user just had.</text>

      <!-- Free-standing notes -->
      <text x="20" y="660" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">guards: RequireAuth · RequireSeller — refresh failure clears the session and redirects to /login?next=...</text>
      <text x="20" y="676" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">no global client store: server state lives in TanStack Query, the token lives in the auth context</text>

      <!-- ── Nodes ────────────────────────────────────────────────── -->
      <rect x="180" y="36" width="160" height="56" fill="#f5f5f5"/>
      <rect x="180" y="36" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="188" y="44" width="42" height="13" rx="2" fill="transparent" stroke="rgba(122,131,153,0.50)" stroke-width="0.8"/>
      <text x="209" y="53" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">ACTOR</text>
      <text x="260" y="74" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Browser</text>
      <text x="260" y="86" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cookie only, no storage</text>

      <rect x="460" y="36" width="160" height="56" fill="#f5f5f5"/>
      <rect x="460" y="36" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="468" y="44" width="40" height="13" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="488" y="53" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">GATE</text>
      <text x="540" y="74" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">gateway :8080</text>
      <text x="540" y="86" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ identity :8081</text>

      <rect x="740" y="36" width="160" height="56" fill="#f5f5f5"/>
      <rect x="740" y="36" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="748" y="44" width="36" height="13" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="766" y="53" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">APPCL</text>
      <text x="820" y="74" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">web (React)</text>
      <text x="820" y="86" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auth context</text>

      <!-- ── Legend ───────────────────────────────────────────────── -->
      <line x1="20" y1="684" x2="980" y2="684" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="20" y="706" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-transform="uppercase">LEGEND</text>
      <line x1="100" y1="702" x2="120" y1="702" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="128" y="705" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HTTP call</text>
      <line x1="240" y1="702" x2="260" y1="702" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="268" y="705" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">return</text>
      <line x1="380" y1="702" x2="400" y1="702" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="408" y="705" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">the load-bearing step</text>
      <rect x="620" y="697" width="14" height="10" rx="2" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="642" y="705" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">self step</text>
      <rect x="760" y="694" width="14" height="16" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="782" y="705" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">opt fragment</text>
    </svg>
  </div>
</body>
</html>
