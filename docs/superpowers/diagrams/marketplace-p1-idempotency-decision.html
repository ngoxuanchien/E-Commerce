<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idempotency: the same key, four different answers</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>One Idempotency-Key, four different answers</h1>

    <svg viewBox="0 0 1000 844" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="marketplace-p1-idempotency-decision-title marketplace-p1-idempotency-decision-desc">
      <title id="marketplace-p1-idempotency-decision-title">One Idempotency-Key, four different answers</title>
      <desc id="marketplace-p1-idempotency-decision-desc">A checkout request is keyed by user and request hash: a stored response is replayed verbatim, a request still in flight returns conflict, a different body under the same key is rejected as reuse, and a failed stock reservation releases every order in the checkout rather than leaving some reserved.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ── Arrows (drawn first) ─────────────────────────────────── -->

      <!-- start → key check -->
      <line x1="300" y1="112" x2="300" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- key check → same hash? -->
      <line x1="300" y1="252" x2="300" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- same hash → response stored? (right) -->
      <path d="M384 336 L560 336 Q568 336 568 344 L568 400" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="480" y="318" width="112" height="12" fill="#f5f5f5"/>
      <text x="536" y="327" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">same hash</text>

      <!-- same hash → still in progress (below) -->
      <line x1="300" y1="384" x2="300" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="222" y="400" width="156" height="12" fill="#f5f5f5"/>
      <text x="300" y="409" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">no stored response</text>

      <!-- in progress → 409 -->
      <line x1="300" y1="500" x2="300" y2="556" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="242" y="516" width="116" height="12" fill="#f5f5f5"/>
      <text x="300" y="525" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">still running</text>

      <!-- different hash → 422 (left) -->
      <path d="M216 336 L144 336 Q136 336 136 344 L136 684" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="140" y="320" width="72" height="12" fill="#f5f5f5"/>
      <text x="176" y="329" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">different</text>

      <!-- stored → replay verbatim -->
      <line x1="568" y1="484" x2="568" y2="556" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="500" y="508" width="136" height="12" fill="#f5f5f5"/>
      <text x="568" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">replay the stored</text>

      <!-- replay → join into the new-request path -->
      <path d="M568 612 L568 656 Q568 668 556 668 L356 668" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- new request path continues down the middle-right -->
      <line x1="300" y1="612" x2="300" y2="652" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M300 668 L340 668" fill="none" stroke="#4f5d75" stroke-width="1.2"/>

      <!-- the reservation outcome -->
      <line x1="356" y1="668" x2="356" y2="700" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ── Shapes ───────────────────────────────────────────────── -->

      <!-- Start -->
      <rect x="200" y="80" width="200" height="32" rx="16" fill="#f5f5f5"/>
      <rect x="200" y="80" width="200" height="32" rx="16" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="300" y="100" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">POST /api/checkout</text>

      <!-- Step: hash the body -->
      <rect x="188" y="168" width="224" height="84" rx="6" fill="#f5f5f5"/>
      <rect x="188" y="168" width="224" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="196" y="176" width="34" height="13" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="213" y="185" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">APP</text>
      <text x="300" y="204" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">sha256(request body)</text>
      <text x="300" y="224" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">insert (user_id, key, hash)</text>
      <text x="300" y="240" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">key is required, 1-100 chars</text>

      <!-- Decision: same hash? -->
      <rect x="300" y="300" width="168" height="84" fill="#f5f5f5"/>
      <path d="M384 300 L468 342 L384 384 L300 342 Z" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="384" y="336" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Same hash</text>
      <text x="384" y="352" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">as a stored key?</text>

      <!-- Decision: response stored? -->
      <rect x="484" y="400" width="168" height="84" fill="#f5f5f5"/>
      <path d="M568 400 L652 442 L568 484 L484 442 Z" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="568" y="436" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Response</text>
      <text x="568" y="452" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">already stored?</text>

      <!-- Decision: still in progress -->
      <rect x="300" y="432" width="168" height="68" fill="#f5f5f5"/>
      <path d="M384 432 L468 466 L384 500 L300 466 Z" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="384" y="462" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">In progress?</text>

      <!-- Terminal 409 -->
      <rect x="196" y="556" width="208" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="196" y="556" width="208" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="204" y="564" width="52" height="13" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="230" y="573" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">409</text>
      <text x="300" y="588" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">CONFLICT</text>
      <text x="300" y="604" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">retry later, nothing created</text>

      <!-- Terminal 422 (left) -->
      <rect x="60" y="684" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="684" width="176" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="68" y="692" width="52" height="13" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="94" y="701" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">422</text>
      <text x="148" y="716" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">KEY_REUSED</text>
      <text x="148" y="732" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">a new body, an old key</text>

      <!-- Replay (right) -->
      <rect x="464" y="556" width="208" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="464" y="556" width="208" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="472" y="564" width="52" height="13" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="498" y="573" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">REPLAY</text>
      <text x="568" y="588" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">stored response</text>
      <text x="568" y="604" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">byte-for-byte, same status</text>

      <!-- The reserve outcome (the load-bearing step) -->
      <rect x="244" y="700" width="224" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="244" y="700" width="224" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="252" y="708" width="40" height="13" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="272" y="717" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="middle">GRPC</text>
      <text x="356" y="732" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">ReserveStock per order</text>
      <text x="356" y="752" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3s timeout · 2 retries</text>
      <text x="356" y="766" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one order per shop</text>

      <!-- ── Labels for the arrows already drawn ──────────────────── -->
      <text x="20" y="300" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">the key alone is not enough —</text>
      <text x="20" y="314" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">the body has to match too</text>

      <!-- Editorial insight -->
      <text x="600" y="300" fill="#2d3142" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">A double-click is not a retry;</text>
      <text x="600" y="320" fill="#2d3142" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">it is the same key meeting the same body.</text>

      <!-- Free-standing notes -->
      <text x="600" y="644" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">any reservation fails → ReleaseStock for every order in this</text>
      <text x="600" y="660" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">checkout, then all are CANCELLED: 409 OUT_OF_STOCK, or 503</text>
      <text x="600" y="676" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">keys older than 24 h are deleted by the same sweeper job</text>

      <!-- ── Legend ───────────────────────────────────────────────── -->
      <line x1="20" y1="790" x2="980" y2="790" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="20" y="812" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-transform="uppercase">LEGEND</text>
      <rect x="100" y="800" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="122" y="808" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">step</text>
      <path d="M210 793 L222 805 L234 793 L222 815 Z" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="242" y="808" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">decision</text>
      <rect x="340" y="800" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="362" y="808" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">terminal outcome</text>
      <rect x="500" y="800" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="522" y="808" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">focal</text>
      <line x1="620" y1="805" x2="640" y1="805" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="648" y="808" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">the branch worth noticing</text>
    </svg>
  </div>
</body>
</html>
