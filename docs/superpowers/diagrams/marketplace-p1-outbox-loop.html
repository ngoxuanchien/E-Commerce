<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The outbox is a loop, not a pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Loop · Transactional Outbox</p>
    <h1>The outbox is a loop, not a pipeline</h1>

    <svg viewBox="0 0 1040 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="marketplace-p1-outbox-loop-title marketplace-p1-outbox-loop-desc">
      <title id="marketplace-p1-outbox-loop-title">Transactional outbox loop</title>
      <desc id="marketplace-p1-outbox-loop-desc">A business transaction commits its state change and an outbox row together; a relay claims unpublished rows, publishes them to the order.events topic, marks them published, and a dedup-aware consumer in catalog-svc releases stock and returns the outcome to the same table.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- ============ RING FLOW (clockwise, one circle R=240) ============ -->
      <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
        <path d="M 600.000 113.726 A 240 240 0 0 1 733.784 230.930"/>
        <path d="M 755.932 296.000 A 240 240 0 0 1 696.043 503.122"/>
        <path d="M 594.940 568.000 A 240 240 0 0 1 446.201 568.372"/>
        <path d="M 344.774 504.000 A 240 240 0 0 1 283.851 297.180"/>
        <path d="M 305.673 232.000 A 240 240 0 0 1 438.870 114.129"/>
      </g>

      <!-- ============ DASHED WRITE-BACK SPOKES (inward, true radii) ============ -->
      <g fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)">
        <path d="M 520.00 132.00 L 520.00 282.00"/>
        <path d="M 668.00 289.99 L 625.71 305.65"/>
      </g>

      <!-- Spoke labels: opaque paper masks, 6-10px clear of their stroke -->
      <rect x="526" y="201" width="52" height="12" fill="#f5f5f5"/>
      <text x="530" y="210" fill="#7a8399" font-size="8" letter-spacing="0.06em" font-family="'Geist Mono', monospace">INSERT</text>

      <rect x="652" y="303" width="76" height="12" fill="#f5f5f5"/>
      <text x="656" y="312" fill="#7a8399" font-size="8" letter-spacing="0.06em" font-family="'Geist Mono', monospace">MARK PUBLISHED</text>

      <!-- ============ STATIONS ============ -->
      <!-- Business tx -->
      <rect x="440" y="68" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="68" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="448" y="75" width="18" height="11" rx="2" fill="transparent" stroke="rgba(79,93,117,0.45)" stroke-width="0.8"/>
      <text x="457" y="83.5" fill="#7a8399" font-size="7" letter-spacing="0.08em" text-anchor="middle" font-family="'Geist Mono', monospace">TX</text>
      <text x="520" y="104" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist', sans-serif">Business tx</text>
      <text x="520" y="122" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">outbox.Write(ctx, tx, …)</text>
      <!-- Outbox relay -->
      <rect x="668" y="232" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="668" y="232" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="676" y="239" width="28" height="11" rx="2" fill="transparent" stroke="rgba(79,93,117,0.45)" stroke-width="0.8"/>
      <text x="690" y="247.5" fill="#7a8399" font-size="7" letter-spacing="0.08em" text-anchor="middle" font-family="'Geist Mono', monospace">RELAY</text>
      <text x="748" y="268" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist', sans-serif">Outbox relay</text>
      <text x="748" y="286" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">SKIP LOCKED · 100 / 500ms</text>
      <!-- Kafka order.events -->
      <rect x="580" y="504" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="580" y="504" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="588" y="511" width="28" height="11" rx="2" fill="transparent" stroke="rgba(235,108,54,0.55)" stroke-width="0.8"/>
      <text x="602" y="519.5" fill="#eb6c36" font-size="7" letter-spacing="0.08em" text-anchor="middle" font-family="'Geist Mono', monospace">TOPIC</text>
      <text x="660" y="540" fill="#eb6c36" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist', sans-serif">Kafka order.events</text>
      <text x="660" y="558" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">acks=all · key order_id</text>
      <!-- Consumer dedup -->
      <rect x="300" y="504" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="300" y="504" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="308" y="511" width="44" height="11" rx="2" fill="transparent" stroke="rgba(79,93,117,0.45)" stroke-width="0.8"/>
      <text x="330" y="519.5" fill="#7a8399" font-size="7" letter-spacing="0.08em" text-anchor="middle" font-family="'Geist Mono', monospace">CONSUMER</text>
      <text x="380" y="540" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist', sans-serif">Consumer dedup</text>
      <text x="380" y="558" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">event_id → processed_events</text>
      <!-- Release stock -->
      <rect x="212" y="232" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="212" y="232" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="220" y="239" width="20" height="11" rx="2" fill="transparent" stroke="rgba(79,93,117,0.45)" stroke-width="0.8"/>
      <text x="230" y="247.5" fill="#7a8399" font-size="7" letter-spacing="0.08em" text-anchor="middle" font-family="'Geist Mono', monospace">RPC</text>
      <text x="292" y="268" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist', sans-serif">Release stock</text>
      <text x="292" y="286" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">ReleaseStock · order_id</text>

      <!-- ============ HUB: the one shared-state element ============ -->
      <rect x="420" y="288" width="200" height="104" rx="8" fill="#f5f5f5"/>
      <rect x="420" y="288" width="200" height="104" rx="8" fill="#2d3142"/>
      <text x="520" y="314" fill="rgba(245,245,245,0.65)" font-size="7" letter-spacing="0.08em" text-anchor="middle" font-family="'Geist Mono', monospace">SHARED STATE</text>
      <text x="520" y="338" fill="#f5f5f5" font-size="13" font-weight="600" text-anchor="middle" font-family="'Geist', sans-serif">outbox table</text>
      <text x="520" y="356" fill="rgba(245,245,245,0.80)" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">unpublished rows</text>
      <text x="520" y="372" fill="rgba(245,245,245,0.60)" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">outbox_unpublished_idx</text>

      <!-- ============ ANNOTATION ============ -->
      <text x="520" y="628" fill="#2d3142" font-size="14" font-style="italic" text-anchor="middle" font-family="'Instrument Serif', serif">A crash between publish and commit re-sends the event.</text>
      <text x="520" y="652" fill="#4f5d75" font-size="14" font-style="italic" text-anchor="middle" font-family="'Instrument Serif', serif">At-least-once, so consumer dedup is mandatory.</text>

      <!-- ============ LEGEND (horizontal strip) ============ -->
      <line x1="40" y1="684" x2="1000" y2="684" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="40" y="702" fill="#7a8399" font-size="7" letter-spacing="0.18em" font-family="'Geist Mono', monospace">LEGEND</text>

      <line x1="142" y1="698" x2="168" y2="698" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="176" y="702" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ring flow</text>

      <line x1="372" y1="698" x2="398" y2="698" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <text x="406" y="702" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">write-back</text>

      <rect x="592" y="692" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="614" y="702" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">focal node</text>

      <rect x="802" y="692" width="14" height="10" rx="2" fill="#2d3142"/>
      <text x="824" y="702" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">shared state</text>

    </svg>
  </div>
</body>
</html>
