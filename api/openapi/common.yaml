openapi: 3.1.0
info:
  title: Marketplace — shared components
  version: 1.0.0
  description: Schemas, parameters, responses and security schemes shared by identity.yaml, catalog.yaml and order.yaml.
servers:
  - url: http://localhost:8080
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 access token issued by identity-svc. Verified by the gateway.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly refresh token cookie (Path=/api/auth).
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's next_cursor.
      schema:
        type: string
        maxLength: 500
  schemas:
    Id:
      type: string
      format: uuid
      description: UUIDv7.
    Timestamp:
      type: string
      format: date-time
      description: UTC, RFC 3339.
    Money:
      type: integer
      format: int64
      minimum: 0
      description: Amount in VND (no decimals).
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - OUT_OF_STOCK
        - INSUFFICIENT_FUNDS
        - INVALID_STATE_TRANSITION
        - PAYLOAD_TOO_LARGE
        - IDEMPOTENCY_KEY_REUSED
        - RATE_LIMITED
        - INTERNAL
        - UPSTREAM_UNAVAILABLE
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              description: |
                VALIDATION_ERROR: {"fields": {"<json path>": "<message>"}}.
                OUT_OF_STOCK: {"shortages": [{"sku_id", "requested", "available"}]}.
                CONFLICT on a seller product PATCH with a stale expected_stock: {"skus": [{"sku_id", "expected_stock", "stock"}]}.
                INSUFFICIENT_FUNDS: {"available": <Money>}.
                INVALID_STATE_TRANSITION (payments): {"reason": COD_CHECKOUT | NOT_AWAITING_PAYMENT | DEADLINE_PASSED | ALREADY_PAID | BELOW_PROVIDER_MINIMUM}.
    ShopRef:
      type: object
      required: [id, name, slug]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        slug:
          type: string
  responses:
    ValidationError:
      description: Request validation failed (VALIDATION_ERROR).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Missing or invalid credentials (UNAUTHENTICATED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not allowed (FORBIDDEN).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found or not visible to the caller (NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict with current state (CONFLICT, OUT_OF_STOCK, INVALID_STATE_TRANSITION, INSUFFICIENT_FUNDS).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests (RATE_LIMITED).
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: INTERNAL (500) or UPSTREAM_UNAVAILABLE (503).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Request body exceeds 1 MB (PAYLOAD_TOO_LARGE); returned by the gateway.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
