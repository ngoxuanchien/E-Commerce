openapi: 3.1.0
info:
  title: Marketplace — catalog API
  version: 1.0.0
  description: Shops, categories, products, SKUs, search and image uploads.
servers:
  - url: http://localhost:8080
tags:
  - name: browse
    description: Public catalog.
  - name: shops
    description: Shops.
  - name: seller
    description: Seller center (requires role seller).
paths:
  /api/categories:
    get:
      tags: [browse]
      operationId: listCategories
      summary: Two-level category tree.
      security: []
      responses:
        '200':
          description: Top-level categories with children.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '429':
          $ref: 'common.yaml#/components/responses/RateLimited'
        5XX:
          $ref: 'common.yaml#/components/responses/ServerError'
  /api/products:
    get:
      tags: [browse]
      operationId: searchProducts
      summary: Search/browse active products (Vietnamese, accent-insensitive).
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: category
          in: query
          description: Category slug; includes child categories.
          schema:
            type: string
        - name: shop
          in: query
          description: Shop slug.
          schema:
            type: string
        - name: min_price
          in: query
          schema:
            $ref: 'common.yaml#/components/schemas/Money'
        - name: max_price
          in: query
          schema:
            $ref: 'common.yaml#/components/schemas/Money'
        - name: sort
          in: query
          description: Defaults to relevance when q is present, otherwise newest.
          schema:
            type: string
            enum: [relevance, newest, price_asc, price_desc]
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSummaryPage'
        '400':
          $ref: 'common.yaml#/components/responses/ValidationError'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '429':
          $ref: 'common.yaml#/components/responses/RateLimited'
        5XX:
          $ref: 'common.yaml#/components/responses/ServerError'
  /api/products/{id}:
    get:
      tags: [browse]
      operationId: getProduct
      summary: Product detail. Non-active products are 404 except for their shop owner.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '429':
          $ref: 'common.yaml#/components/responses/RateLimited'
        5XX:
          $ref: 'common.yaml#/components/responses/ServerError'
  /api/shops:
    post:
      tags: [shops]
      operationId: createShop
      summary: Open a shop; the caller becomes a seller (call /api/auth/refresh afterwards for a token with the new role).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '400':
          $ref: 'common.yaml#/components/responses/ValidationError'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '413':
          $ref: 'common.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: 'common.yaml#/components/responses/RateLimited'
        5XX:
          $ref: 'common.yaml#/components/responses/ServerError'
  /api/shops/me:
    get:
      tags: [shops, seller]
      operationId: getMyShop
      summary: The caller's shop.
      x-required-role: seller
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's shop.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '429':
          $ref: 'common.yaml#/components/responses/RateLimited'
        5XX:
          $ref: 'common.yaml#/components/responses/ServerError'
    patch:
      tags: [shops, seller]
      operationId: updateMyShop
      summary: Update name/description. The slug is immutable.
      x-required-role: seller
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopUpdate'
      responses:
        '200':
          description: Updated shop.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '400':
          $ref: 'common.yaml#/components/responses/ValidationError'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '413':
          $ref: 'common.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: 'common.yaml#/components/responses/RateLimited'
        5XX:
          $ref: 'common.yaml#/components/responses/ServerError'
  /api/shops/{slug}:
    get:
      tags: [shops, browse]
      operationId: getShop
      summary: Shop by slug.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The shop.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '429':
          $ref: 'common.yaml#/components/responses/RateLimited'
        5XX:
          $ref: 'common.yaml#/components/responses/ServerError'
  /api/seller/products:
    get:
      tags: [seller]
      operationId: listSellerProducts
      summary: The caller's products, including drafts and archived.
      x-required-role: seller
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProductStatus'
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of the seller's products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: 'common.yaml#/components/responses/ValidationError'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '429':
          $ref: 'common.yaml#/components/responses/RateLimited'
        5XX:
          $ref: 'common.yaml#/components/responses/ServerError'
    post:
      tags: [seller]
      operationId: createSellerProduct
      summary: Create a product with its SKUs.
      x-required-role: seller
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: 'common.yaml#/components/responses/ValidationError'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '413':
          $ref: 'common.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: 'common.yaml#/components/responses/RateLimited'
        5XX:
          $ref: 'common.yaml#/components/responses/ServerError'
  /api/seller/products/{id}:
    patch:
      tags: [seller]
      operationId: updateSellerProduct
      summary: Partial update. SKUs with id are updated, without id created, omitted ones deactivated.
      x-required-role: seller
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPatch'
      responses:
        '200':
          description: Updated product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: 'common.yaml#/components/responses/ValidationError'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '413':
          $ref: 'common.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: 'common.yaml#/components/responses/RateLimited'
        5XX:
          $ref: 'common.yaml#/components/responses/ServerError'
    delete:
      tags: [seller]
      operationId: archiveSellerProduct
      summary: Archive (status=archived).
      x-required-role: seller
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204':
          description: Archived.
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '429':
          $ref: 'common.yaml#/components/responses/RateLimited'
        5XX:
          $ref: 'common.yaml#/components/responses/ServerError'
  /api/seller/uploads:
    post:
      tags: [seller]
      operationId: createUpload
      summary: Presigned POST for one product image (max 5 MB, expires in 10 minutes).
      x-required-role: seller
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '200':
          description: Upload form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: 'common.yaml#/components/responses/ValidationError'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '413':
          $ref: 'common.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: 'common.yaml#/components/responses/RateLimited'
        5XX:
          $ref: 'common.yaml#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      $ref: 'common.yaml#/components/securitySchemes/bearerAuth'
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        $ref: 'common.yaml#/components/schemas/Id'
  schemas:
    Category:
      type: object
      required: [id, name, slug, children]
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/Id'
        name:
          type: string
        slug:
          type: string
        children:
          type: array
          description: Empty for second-level categories.
          items:
            $ref: '#/components/schemas/Category'
    Shop:
      type: object
      required: [id, name, slug, description, owner_user_id, created_at]
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/Id'
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        owner_user_id:
          $ref: 'common.yaml#/components/schemas/Id'
        created_at:
          $ref: 'common.yaml#/components/schemas/Timestamp'
    ShopCreate:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 80
        slug:
          type: string
          pattern: '^[a-z0-9-]{3,50}$'
          description: Must not be one of me, new, admin, seller.
        description:
          type: string
    ShopUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 80
        description:
          type: string
    ProductStatus:
      type: string
      enum: [draft, active, archived]
    Sku:
      type: object
      required: [id, name, price, stock, active]
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/Id'
        name:
          type: string
        price:
          $ref: 'common.yaml#/components/schemas/Money'
        stock:
          type: integer
          format: int32
          minimum: 0
        active:
          type: boolean
    SkuInput:
      type: object
      required: [name, price, stock]
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/Id'
        name:
          type: string
          minLength: 1
        price:
          type: integer
          format: int64
          minimum: 1000
          maximum: 1000000000
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
        active:
          type: boolean
          default: true
    ProductImage:
      type: object
      required: [object_key, url]
      properties:
        object_key:
          type: string
        url:
          type: string
          format: uri
    Product:
      type: object
      required: [id, shop, category_id, name, description, status, images, skus, min_price, created_at, updated_at]
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/Id'
        shop:
          $ref: 'common.yaml#/components/schemas/ShopRef'
        category_id:
          $ref: 'common.yaml#/components/schemas/Id'
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        skus:
          type: array
          items:
            $ref: '#/components/schemas/Sku'
        min_price:
          description: Lowest price among active SKUs; null when none is active.
          oneOf:
            - $ref: 'common.yaml#/components/schemas/Money'
            - type: 'null'
        created_at:
          $ref: 'common.yaml#/components/schemas/Timestamp'
        updated_at:
          $ref: 'common.yaml#/components/schemas/Timestamp'
    ProductSummary:
      type: object
      required: [id, name, image_url, min_price, shop]
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/Id'
        name:
          type: string
        image_url:
          description: First image, or null.
          oneOf:
            - type: string
              format: uri
            - type: 'null'
        min_price:
          $ref: 'common.yaml#/components/schemas/Money'
        shop:
          $ref: 'common.yaml#/components/schemas/ShopRef'
    ProductSummaryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        next_cursor:
          type: [string, 'null']
    ProductPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          type: [string, 'null']
    ProductPatch:
      type: object
      minProperties: 1
      properties:
        category_id:
          $ref: 'common.yaml#/components/schemas/Id'
        name:
          type: string
          minLength: 5
          maxLength: 200
        description:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'
        image_keys:
          type: array
          maxItems: 9
          description: Object keys returned by /api/seller/uploads (prefix shops/{shop_id}/). Order = display order.
          items:
            type: string
        skus:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/SkuInput'
    ProductInput:
      allOf:
        - $ref: '#/components/schemas/ProductPatch'
        - type: object
          required: [category_id, name, status, skus]
    UploadRequest:
      type: object
      required: [content_type]
      properties:
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
    UploadResponse:
      type: object
      required: [upload_url, fields, object_key, public_url]
      properties:
        upload_url:
          type: string
          format: uri
          description: POST multipart/form-data here with `fields` followed by the `file` field.
        fields:
          type: object
          additionalProperties:
            type: string
        object_key:
          type: string
        public_url:
          type: string
          format: uri
