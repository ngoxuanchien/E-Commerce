extends:
  - recommended
rules:
  # Portfolio project without a published license.
  info-license: off
  info-license-strict: off
  # Deliberate choice, not a workaround: this is a local-only project
  # (deploy/docker-compose.yml) with no production domain to advertise.
  # http://localhost:8080 matches the gateway port in spec §3 and is
  # genuinely how the API is reached in this repo, in every spec file.
  no-server-example.com: off
